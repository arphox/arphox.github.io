<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/local-tools/tools.css' | relative_url }}">
  </head>
  <body>
    <a class="local-tools-skip-link" href="#main-content">Skip to content</a>
    {%- include header.html -%}
    <main id="main-content" class="page-content local-tools" aria-labelledby="page-title">
      <div class="wrapper">
        {% unless page.url == '/local-tools/' %}
          <p class="local-tools-back"><a href="{{ '/local-tools/' | relative_url }}">&larr; All local tools</a></p>
        {% endunless %}
        <header class="local-tools-heading">
          <h1 id="page-title">{{ page.title | escape }}</h1>
          {% if page.subtitle %}<p>{{ page.subtitle | escape }}</p>{% endif %}
        </header>
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
