# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Károly Ozsvárt
description: >- # this means to ignore newlines until "baseurl:"
  Personal notes on software engineering and beyond, plus useful browser tools.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://arphox.github.io" # the base hostname & protocol for your site
github_username: arphox

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/social-card.jpg
        width: 1200
        height: 630
        alt: "Károly Ozsvárt — personal notes and browser tools"

header_pages:
  - local-tools/index.html
  - about.markdown
  - cv.html

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%Y-%m-%d"
